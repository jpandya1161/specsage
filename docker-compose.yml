services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      SPECSAGE_QDRANT_URL: http://qdrant:6333
      # Ollama runs on the host (Docker Desktop resolves host.docker.internal;
      # the extra_hosts entry makes it work on Linux too)
      SPECSAGE_OLLAMA_BASE_URL: http://host.docker.internal:11434
      SPECSAGE_OLLAMA_MODEL: ${SPECSAGE_OLLAMA_MODEL:-llama3.1:8b}
    volumes:
      - ./data:/app/data
      - model-cache:/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  model-cache:
